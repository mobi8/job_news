  # - targets: JobSpy configurations.
  #   Each target has:
  #   * id: unique identifier.
  #   * site: job board to scrape (indeed, linkedin, etc.).
  #   * source: links to source_metadata.id.
  #   * country: regional label.
  #   * location: city/region name.
  #   * indeed_country: (for Indeed site) country name for JobSpy.
  #   * keywords_from: reference to another source's keyword_groups
