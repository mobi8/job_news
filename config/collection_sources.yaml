# External collection source registry.
#
# This is the single user-managed source of truth for job/news collection targets.
# Keep scoring rules, parser logic, and complex regex in Python code.
#
# Key concepts:
# - This file is the SOURCE OF TRUTH for external collection sources. All runtime collection
#   behavior depends on settings here.
# - Validation: `venv312/bin/python -m src.utils.collection_config --check` (run after edits)
# - `enabled: false` means this source/target will be skipped during collection runs.
# - Selector resolution priority: phase > target_id > keyword_group_id > alias
#   (When referencing a target via Telegram, CLI, or API, the system searches in this order.)
# - target_groups: organize multiple target_ids into logical groups (e.g., "uae", "remote").
# - keyword_groups: define search queries for a target (each keyword_group generates one URL/plan).
#   Difference: target_groups are organizational; keyword_groups are functional (they create URLs).
# - To add a new country/region: add source_metadata entry, then add targets pointing to its id.
# - URL builder types:
#   * generated_search: code builds URL from template (e.g., location + keywords -> LinkedIn URL).
#   * explicit_url/fixed_page: URL is hardcoded; modify only if upstream site structure changes.
#   * generated_plans: multiple lead/role/location combinations are multiplied to create search plans.
# - Environment variable priority: env > YAML > code default
#   (e.g., batch size can be overridden with env var, but YAML is the default.)
#
# Minimal edit examples:
# - Disable one target: set `enabled: false`.
# - Add one Indeed keyword: append `{id: new_topic, query: "new topic"}` under the target's `keyword_groups`.
# - Add one RSS feed: append an item under `sources.news_feeds` with `id`, `source`, `label`, `url`, and `parser: rss`.
version: 1

# ============================================================================
# source_metadata: Labels, Aliases, and Country Registration
# ============================================================================
# Controls how sources appear in dashboards, APIs, and frontend filters.
# Every source referenced elsewhere (id, in targets, or in recruiters.companies)
# should have a matching source_metadata entry.
#
# Key fields:
# - id: unique identifier (referenced by targets via `source` field).
# - label: display name for dashboards and UI.
# - aliases: alternative names for programmatic reference (e.g., /jobs linkedin works via alias).
# - country: primary country/region this source serves (used for filtering and display).
# - group: logical grouping for UI organization (Job Pages, LinkedIn, Indeed, etc.).
# - kind: type of content (jobs, news, etc.).
#
# Common mistakes:
# - Adding a target with a source id that has no source_metadata entry.
# - Changing a source id without updating all targets that reference it.
#
# Example: To add a new Indeed country (Singapore):
# - Create source_metadata entry with unique id (e.g., indeed_singapore).
# - Add target under sources.indeed.targets pointing to this id.
# - Add keyword_groups to the target with search queries.

