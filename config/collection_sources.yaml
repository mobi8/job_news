  # ========================================================================
  # job_pages: Fixed Job Listing Pages
  # ========================================================================
  # Fixed pages for static job board URLs (e.g., company careers pages, ATS systems).
  # These URLs do NOT change based on keywords or locations.
  # Modify URL only if the upstream site structure changes.
  #
  # Fields:
  # - id: unique identifier.
  # - enabled: set to false to skip this page during collection.
  # - type: fixed_page for static URLs; explicit_url for one-time URLs.
  # - fetch_method: http (simple) or browser (JavaScript-heavy sites).
  # - source: links to source_metadata.id (provides label, country, aliases).
  # - url: exact URL to fetch; keep as-is unless site changes.
  # - parser: parser name (jobvite, smartrecruiters, bamboohr, etc.).
  # - country: regional label (used for filtering and metadata).
  #
  # Do not modify:
  # - id (tracked in database)
  # - url (unless you know the site changed)
  # - parser (changing breaks data extraction)
  #
  # Generated count check: 6 pages total (if any enabled).

  # Fixed or explicit job pages. Keep URL strings exact unless the upstream site changes.
  job_pages:
  - id: pragmatic_jobvite
    enabled: true
    type: fixed_page
    fetch_method: http
    source: jobvite_pragmaticplay
    label: Pragmatic Play Jobvite
    url: https://jobs.jobvite.com/pragmaticplay/jobs
    parser: jobvite
    country: Global
  - id: pragmatic_smartrecruiters
    enabled: true
    type: fixed_page
    fetch_method: http
    source: smartrecruitment
    label: Pragmatic Play SmartRecruiters
    url: https://jobs.smartrecruitment.com/jobs?department_id=20888
    parser: smartrecruiters
    country: Global
  - id: igaming_recruitment
    enabled: true
    type: fixed_page
    fetch_method: http
    source: igamingrecruitment
    label: iGaming Recruitment
    url: https://igamingrecruitment.io/jobs/
    parser: igaming_recruitment
    country: Global
  - id: igaminghunt_bamboohr
    enabled: true
    type: fixed_page
    fetch_method: http
    source: igaminghunt_bamboohr
    label: IGAMINGHUNT BambooHR
    url: https://igaminghunt.bamboohr.com/jobs/embed2.php
    parser: bamboohr
    country: Global
  - id: jobrapido_uae
    enabled: true
    type: explicit_url
    fetch_method: http
    source: jobrapido_uae
    label: Jobrapido UAE
    url: https://ae.jobrapido.com/?w=igaming&l=dubai&r=&shm=all
    parser: jobrapido
    country: UAE
  - id: jobleads_uae
    enabled: true
    type: explicit_url
    fetch_method: http
    source: jobleads
    label: JobLeads UAE
    url: https://www.jobleads.com/search/jobs?keywords=igaming&location=las+al+kaima&location_country=AE&filter_by_daysReleased=31&location_radius=50&minSalary=120000&page=2
    parser: jobleads
    country: UAE
  telegram_channels: []

  # ========================================================================
  # linkedin_jobs: LinkedIn Job Search Targets
  # ========================================================================
  # Browser-based LinkedIn job searches with generated URLs.
  # URL is built from location, geo_id, remote flag, and keyword queries.
  # Use `explicit_override` only to preserve exact LinkedIn URLs (rare).
  #
  # Structure:
  # - target_groups: organize target_ids by country/region (e.g., "uae", "remote").
  #   Each target_group has:
  #   * id: internal name for CLI/API reference.
  #   * aliases: alternative names (e.g., linkedin_uae works via alias).
  #   * target_ids: list of target ids in this group.
  #   * keyword_groups: organizes keyword_group_ids by category (crypto, payments, etc.)
  #     (Note: keyword_groups here link to ids; actual queries are in targets.keyword_groups)
  # - targets: actual search configurations that generate URLs.
  #   Each target has:
  #   * id: unique identifier.
  #   * source: links to source_metadata.id.
  #   * country: regional label.
  #   * location: geographic location string (e.g., "Dubai, United Arab Emirates").
  #   * geo_id: LinkedIn geo ID (e.g., '90009603' for Dubai). Refine search geographically.
  #   * remote: true if this is remote work; adds parameter to URL.
  #   * keyword_groups: list of queries that generate URLs.
  #     Each keyword_group has:
  #     - id: unique within this target.
  #     - query: search keywords (use OR for alternatives; URL-encoded automatically).
  #   * url.builder: "linkedin_jobs" to generate URL from location/geo_id/keywords.
  #   * url.explicit_override: (optional) hardcoded URL (bypasses builder; rarely used).
  #
  # Do not modify:
  # - id (tracked in database)
  # - query strings (unless you want different results; see URL in browser first)
  # - target_id references in target_groups (must match target.id exactly)
  #
  # Generated count check: 19 LinkedIn URLs (if all targets enabled).
  #
  # Example: To add LinkedIn Singapore crypto target:
  # 1. Add target with id: linkedin_singapore_crypto, source: linkedin_singapore
  # 2. Set location: "Singapore", geo_id: your_geo_id
  # 3. Add keyword_groups: [{id: crypto, query: "crypto OR web3 OR payments"}]
  # 4. Set url.builder: linkedin_jobs
  # 5. Add target_id to appropriate target_group, or create new target_group.

  # LinkedIn job searches. Generated targets use `builder: linkedin_jobs`;
  # targets with `explicit_override` preserve that URL exactly.
  linkedin_jobs:
    enabled: true
    type: generated_search
    fetch_method: browser
    target_groups:
    - id: uae
      label: UAE
      aliases:
      - linkedin_uae
      - united_arab_emirates
      country: UAE
      target_ids:
      - linkedin_uae_crypto_payment
      - linkedin_uae_web3_wallet
      - linkedin_uae_regulation
      - linkedin_uae_backlog_dubai
      - linkedin_uae_igaming
      - linkedin_uae_crypto_product
      - linkedin_uae_custody_game
      - linkedin_uae_casino_resort
      - linkedin_uae_exchanges
      - linkedin_uae_payments_engineer
      - linkedin_uae_sales
      - linkedin_uae_wallet_ops
      - linkedin_uae_mobile_game
      - linkedin_uae_game_studio
      keyword_groups:
      - id: crypto
        label: Crypto
        aliases:
        - web3
        keyword_group_ids:
        - crypto_payment
        - web3_wallet
        - crypto_product
        - custody_game
        - exchanges
        - wallet_ops
      - id: payments
        label: Payments
        aliases:
        - payment
        keyword_group_ids:
        - crypto_payment
        - payments_engineer
      - id: product
        label: Product
        aliases:
        - product_manager
        - product-manager
        keyword_group_ids:
        - crypto_product
      - id: igaming
        label: iGaming
        keyword_group_ids:
        - igaming
        - casino_resort
    - id: remote
      label: Remote / EMEA
      aliases:
      - emea
      - linkedin_emea
      country: Remote
      target_ids:
      - linkedin_company_42167861_emea
      - linkedin_emea_crypto
      - linkedin_emea_game_dev
      - linkedin_emea_game_studio
      - linkedin_emea_backlog
      keyword_groups:
      - id: crypto
        label: Crypto
        keyword_group_ids:
        - crypto
      - id: game
        label: Game
        keyword_group_ids:
        - game_dev
        - game_studio
      - id: backlog
        label: Backlog
        keyword_group_ids:
        - backlog
    targets:
    - id: linkedin_company_42167861_emea
      enabled: true
      source: linkedin_emea
      country: Remote
      location: EMEA
      url:
        builder: linkedin_jobs
        explicit_override: https://www.linkedin.com/jobs/search/?f_C=42167861&geoId=92000000&origin=COMPANY_PAGE_JOBS_CLUSTER_EXPANSION
    - id: linkedin_emea_crypto
      enabled: true
      source: linkedin_emea
      country: Remote
      location: EMEA
      geo_id: '92000000'
      remote: true
      keyword_groups:
      - id: crypto
        query: crypto OR web3 OR stablecoin OR digital asset OR payments OR igaming OR backlog
      url:
        builder: linkedin_jobs
    - id: linkedin_emea_game_dev
