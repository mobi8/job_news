# External collection source registry.
#
# This is the single user-managed source of truth for job/news collection targets.
# Keep scoring rules, parser logic, and complex regex in Python code.
#
# Minimal edit examples:
# - Disable one target: set `enabled: false`.
# - Add one Indeed keyword: append `{id: new_topic, query: "new topic"}` under the target's `keyword_groups`.
# - Add one RSS feed: append an item under `sources.news_feeds` with `id`, `source`, `label`, `url`, and `parser: rss`.
