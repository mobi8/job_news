  # ========================================================================
  # linkedin_posts: LinkedIn Post Search Plans
  # ========================================================================
  # LinkedIn post discovery (hiring posts, job alerts, recruiter updates).
  # Plan count = enabled_locations * roles * leads (4 * 6 * 5 = 120 if all enabled).
  #
  # Structure: Multiplies 3 dimensions:
  # - leads: hiring intent keywords (hire, hiring, job alert, etc.)
  # - roles: job domains (crypto, igaming, game, etc.)
  # - locations: geographic regions (UAE, MENA Remote, Amsterdam, Australia, Malta)
  # Each combination creates one search plan.
  #
  # Key fields in locations (most important to get right):
  # - query_location: text for LinkedIn search (e.g., "in UAE", "remote MENA OR...")
  # - location_terms: keywords that verify post mentions this location (filtering accuracy depends on this)
  # - enabled: set to false to exclude location from plan generation
  # - category: applies to leads (hiring_post, job_post, recruiter_post)
  #
  # Do not modify:
  # - query_location without testing in LinkedIn search
  # - location_terms (too broad = false positives, too narrow = missed posts)
  # - category values (affects downstream filtering)
  #
  # Generated count check: 120 LinkedIn post plans (if all enabled).
  #
  # To add a new location (e.g., Singapore):
  # 1. Add under locations: id, enabled, country, label, query_location, location_terms
  # 2. Set query_location to search phrase used in LinkedIn
  # 3. Add location_terms with keywords that distinguish posts for this location
  # 4. Plan count will be: (current_locations + 1) * 6 roles * 5 leads

