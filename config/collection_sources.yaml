  # ========================================================================
  # indeed: Indeed Job Search Targets
  # ========================================================================
  # Browser-based Indeed job searches (like linkedin_jobs, but domain-based).
  # URL structure: https://{domain}/jobs?q={query}&l={location}&sort={sort}
  #
  # Key fields (see linkedin_jobs for target_groups/keyword_groups structure):
  # - domain: Indeed regional domain (ae.indeed.com, sg.indeed.com, etc.)
  # - indeed_country: country name for Indeed's site (e.g., "United Arab Emirates")
  # - location: city/region used in URL (e.g., "dubai", "singapore")
  # - sort: sort order (date, relevance, etc.)
  #
  # Do not modify:
  # - id (tracked in database)
  # - domain (wrong domain breaks collection)
  # - query strings without testing
  #
  # Generated count check: 8 Indeed URLs (if all targets enabled).

  # Indeed browser searches. `domain`, `location`, and `keyword_groups.query`
  # build the final URL; metadata below is carried with every generated URL.
  indeed:
    enabled: true
    type: generated_search
    fetch_method: browser
    target_groups:
    - id: uae
      label: UAE
      aliases:
      - indeed_uae
      - united_arab_emirates
      country: UAE
      target_ids:
      - indeed_uae
      keyword_groups:
      - id: crypto
        label: Crypto
        keyword_group_ids:
        - payments
        - crypto_product
        - custody_game
        - exchanges
      - id: payments
        label: Payments
        aliases:
        - payment
        keyword_group_ids:
        - payments
      - id: product
        label: Product
        aliases:
        - product_manager
        - product-manager
        keyword_group_ids:
        - crypto_product
    targets:
    - id: indeed_uae
      enabled: true
      source: indeed_uae
      country: UAE
      location: dubai
      indeed_country: United Arab Emirates
      domain: ae.indeed.com
      sort: date
      keyword_groups:
      - id: korean
        query: korean
      - id: payments
        query: payment OR crypto OR igaming OR neobanking OR backlog
      - id: regulation
        query: adgm OR fsra OR vara
      - id: backlog
        query: backlog
      - id: crypto_product
        query: crypto product manager OR product owner OR neobank OR digital asset OR stable coin OR backlog
      - id: custody_game
        query: custody OR digital asset OR digital assets OR digital asset custody OR stable coin OR game OR gaming
      - id: casino_resort
        query: casino OR gaming resort OR wynn OR al marjan OR IT product manager
      - id: exchanges
        query: binance OR bybit OR okx OR coinbase OR kraken OR bitget OR gate.io OR kucoin OR htx OR crypto.com OR mexc
      url:
        builder: indeed
  # ========================================================================
  # glassdoor: Glassdoor Browserless Search Targets
  # ========================================================================
  # Browserless (no Selenium/browser) Glassdoor searches.
  # Each keyword generates a URL via slug conversion (e.g., "digital asset" -> "digital-asset").
  #
  # Structure:
  # - source: which source_metadata id to use for this entire section.
  # - country: default country for all searches.
  # - url_builder: "glassdoor_uae" (can be extended for other regions).
  # - target_groups: organize keywords by category (crypto, payments, product, etc.).
  #   Each target_group.keyword_groups lists keyword_group_ids (references to `keywords` section).
  # - keywords: list of search terms (each generates one Glassdoor URL).
  # - explicit_urls: (optional) hardcoded URLs that bypass keyword builder.
  #
  # URL structure: https://www.glassdoor.com/Job/{slug}-jobs-SRCH_IN6_KO0,{length}.htm
  # (slug is keyword lowercased and space-replaced with dash)
  #
  # Do not modify:
  # - id (these are auto-generated)
  # - keyword list without testing the resulting URLs in a browser
  #
  # Generated count check: 7 Glassdoor URLs (if all keywords enabled).

  # Browserless Glassdoor searches. Keywords are converted with the Glassdoor UAE URL builder.
  glassdoor:
    enabled: true
    type: generated_search
    fetch_method: browserless
    source: glassdoor_uae
    country: UAE
    url_builder: glassdoor_uae
    target_groups:
    - id: uae
      label: UAE
      aliases:
      - glassdoor_uae
      country: UAE
      keyword_groups:
      - id: crypto
        label: Crypto
        keyword_group_ids:
        - crypto
      - id: payments
        label: Payments
        aliases:
        - payment
        keyword_group_ids:
        - payment
      - id: product
        label: Product
        keyword_group_ids:
        - product
    keywords:
    - crypto
    - igaming
    - payment
    - wallet
    - digital asset
    - product
    - backlog
    explicit_urls: []
  # ========================================================================
  # drjobs: DrJobs Browser Search Targets
  # ========================================================================
  # Browser-based DrJobs (UAE job board) searches.
  # Keywords are converted to URL slugs (e.g., "igaming" -> /igaming-jobs).
  #
  # Structure:
  # - source: which source_metadata id to use.
  # - country: default country (UAE).
  # - url_builder: "drjobs" (converts keywords to /keyword-jobs URLs).
  # - target_groups: organize keywords by category.
  #   Each target_group.keyword_groups lists keyword_group_ids.
  # - keywords: list of search terms (each generates one DrJobs URL).
  # - explicit_urls: (optional) hardcoded URLs that bypass keyword builder.
  #
  # URL structure: https://drjobs.ae/{slug}-jobs
  # (slug is keyword lowercased, first part before " OR ", special chars removed)
  #
  # Do not modify:
  # - id (auto-generated per keyword)
