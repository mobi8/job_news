# ============================================================================
# runtime: Collection Phase Definitions and Runtime Configuration
# ============================================================================
# Defines collection phases (phases are collection tasks that can be run
# individually or as part of a pipeline) and runtime defaults.
#
# Phases section:
# Each phase (all, fixed, drjobs, linkedin, indeed, jobspy, glassdoor,
# recruiters, rss, player, telegram, posts, queue, dashboard, notifications):
# - id: phase identifier (used in CLI: `./run_collect.sh <phase>`).
# - label: human-readable phase name (for Telegram, dashboard, CLI output).
# - description: brief description of what the phase does.
# - aliases: alternative names for CLI/Telegram (e.g., "linkedin_jobs" for "linkedin").
# - order: execution order in full pipeline (10, 20, 30, ...).
# - enabled: if false, this phase is skipped during full runs; can still run manually.
# - timeout_seconds: max time allowed for this phase before timeout.
# - supports_target: if true, can specify individual targets (e.g., /jobs linkedin--linkedin_uae_crypto_payment).
# - telegram_visible: if true, phase appears in Telegram command suggestions.
# - writes_database: if true, phase stores results in database.
# - sends_notification: if true, phase sends completion notifications.
# - full_run_included: if true, phase runs as part of "full collection" (id: all).
# - execution_mode: how phase is launched (python, shell, library).
#
# Defaults section:
# - job_watch_sources: comma-separated source ids to watch (used for alerting).
# - Per-phase settings: batch_size, workers, timeouts, scroll_rounds, pause intervals.
#   These override code defaults. Set via env var (BATCH_SIZE=1) if you need runtime override.
#
# Environment variable override priority: env > YAML > code default
# Example: BATCH_SIZE=4 overrides runtime.linkedin_jobs.batch_size
#
# Do not modify phase ids without updating:
# - Source code references (phase_runner.py, collectors)
# - Telegram bot command mappings
# - Frontend dashboard phase lists
# - Database phase tracking

# Runtime defaults from YAML. Environment variables still take precedence.
runtime:
  phases:
  - id: all
    label: Full Collection
    description: Run the existing full collection pipeline.
    aliases:
