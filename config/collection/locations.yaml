locations:
  uae:
    id: uae
    label: UAE
    enabled: true
    country: UAE
    linkedin:
      source: linkedin_public
      location: "Dubai, United Arab Emirates"
      # Note: UAE public sources use location string, not geo_id
      aliases:
        - united_arab_emirates
    linkedin_posts:
      id: posts_uae
      country: UAE
      store_country: UAE
      label: UAE
      aliases:
        - uae
        - linkedin_posts_uae
      query_location: in UAE
      location_terms:
        - uae
        - dubai
        - abu dhabi
        - united arab emirates
        - emirates
    # Legacy target ID mappings for existing targets
    legacy_target_ids:
      payments: linkedin_uae_crypto_payment
      custody: linkedin_uae_web3_wallet
      product: linkedin_uae_crypto_product
      igaming: linkedin_uae_igaming
      # Note: UAE has no existing "settlement" role target
      # linkedin_uae_custody_game is hybrid (custody_game role ID)

  amsterdam:
