locations:
  uae:
    id: uae
    label: UAE
    enabled: true
    country: UAE
    linkedin:
      source: linkedin_public
      location: "Dubai, United Arab Emirates"
      geo_id: '106204383'
      split_role_searches: true
      # LinkedIn Dubai geo ID; keeps public search pinned to Dubai/UAE.
      aliases:
        - united_arab_emirates
    indeed:
      enabled: true
      source: indeed_uae
      domain: ae.indeed.com
      location: dubai
      country: UAE
      country_indeed: United Arab Emirates
      locale: en_AE
      routing_mode: domain
      sort: date
      enabled_roles:
        - payments
        - treasury
        - custody
        - settlement
        - reconciliation
        - wallet_operations
        - crypto_operations
        - product
        - product_operations
        - delivery
        - implementation
        - integration
        - technical_account
        - account_manager
        - partner_manager
        - business_development
        - fraud
        - risk
        - compliance
        - aml
        - kyc
        - kyb
        - payment_partnerships
        - igaming
        - forex
        - trading_operations
        - liquidity
        - trading_platform
        - korean_language
    linkedin_posts:
      id: posts_uae
      country: UAE
      store_country: UAE
      label: UAE
      aliases:
        - uae
        - linkedin_posts_uae
      query_location: in UAE
      location_terms:
        - uae
        - dubai
        - abu dhabi
        - united arab emirates
        - emirates
    # Legacy target ID mappings for existing targets
    legacy_target_ids:
      payments: linkedin_uae_crypto_payment
      custody: linkedin_uae_web3_wallet
      product: linkedin_uae_crypto_product
      igaming: linkedin_uae_igaming
