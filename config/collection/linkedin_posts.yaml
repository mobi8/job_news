sources:
  linkedin_posts:
    enabled: true
    type: generated_plans
    fetch_method: browser
    source: linkedin_post
    leads:
    - id: hiring
      query: hiring
      category: hiring_post
    - id: job
      query: job
      category: job_post
    roles:
    - id: crypto
      query: crypto
      domain: crypto_payments
      aliases:
      - payments
      - payment
    - id: igaming
      query: igaming
      domain: igaming
    - id: digital_asset
      query: digital asset
      domain: digital_asset
    - id: forex
      query: forex OR FX OR brokerage OR MT4 OR MT5 OR wallet OR crypto OR payment
      domain: forex
    - id: payments
      query: payments OR payment gateway OR PSP OR acquiring OR fintech
      domain: crypto_payments
    - id: partnerships
      query: partnership OR partnerships OR business development OR account manager OR relationship manager
      domain: crypto_payments
    - id: operations
      query: operations OR customer success OR client success OR implementation OR integration
      domain: crypto_payments
    - id: affiliate
      query: affiliate manager OR affiliate marketing OR acquisition manager OR iGaming
      domain: igaming
    locations:
    - uae
    - uae_all
    matrix:
      enabled: true
    filters:
      hiring_terms:
      - hiring
      - we are hiring
      - we're hiring
      - open role
      - job alert
      - looking for
      - vacancy
      - join our team
      - apply
      - referral
      - recruiting
      job_destination_terms:
      - "/jobs/"
      - "/careers/"
      - greenhouse.io
      - lever.co
      - ashbyhq.com
      - workable.com
      - recruitee.com
      - smartrecruiters.com
      domain_terms:
      - crypto
      - web3
      - blockchain
      - payment
      - payments
      - fintech
      - igaming
      - gaming
      - casino
      - sportsbook
      - product
      - business development
      - customer success
      - client success
      - relationship manager
      - affiliate
      - affiliate manager
      - operations
      - operations manager
      - wallet
      - backlog
      excluded_title_terms:
      - law enforcement
      - data scientist
      - ai scientist
      - machine learning engineer
