sources:
  linkedin_posts:
    enabled: true
    type: generated_plans
    fetch_method: browser
    source: linkedin_post
    leads:
    - id: hiring
      query: hiring OR job
      category: hiring_post
    industries:
    - id: payments_fintech
      keywords:
        - payments
        - fintech
        - psp
        - gateway
        - acquiring
        - treasury
        - settlement
        - reconciliation
    - id: crypto_web3
      keywords:
        - crypto
        - blockchain
        - web3
        - digital assets
        - custody
        - wallet
        - stablecoin
    - id: igaming
      keywords:
        - igaming
        - casino
        - sportsbook
        - betting
        - slots
        - live casino
        - game provider
    - id: video_games
      keywords:
        - games
        - game producer
        - game product
        - live operations
        - publishing
        - monetization
    - id: fx_trading
      keywords:
        - forex
        - fx
        - trading
        - brokerage
        - liquidity
        - dealing
    locations: []
    matrix:
      enabled: true
    filters:
      hiring_terms:
      - hiring
      - we are hiring
      - we're hiring
      - open role
      - job alert
      - looking for
      - vacancy
      - join our team
      - apply
      - referral
      - recruiting
      job_destination_terms:
      - "/jobs/"
      - "/careers/"
      - greenhouse.io
      - lever.co
      - ashbyhq.com
      - workable.com
      - recruitee.com
      - smartrecruiters.com
      domain_terms:
      - crypto
      - web3
      - blockchain
      - payment
      - payments
      - fintech
      - igaming
      - gaming
      - casino
      - sportsbook
      - product
      - business development
      - wallet
      - backlog
