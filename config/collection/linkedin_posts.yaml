sources:
  linkedin_posts:
    enabled: true
    type: generated_plans
    fetch_method: browser
    source: linkedin_post
    leads:
    - id: hiring
      query: hiring
      category: hiring_post
    - id: job
      query: job
      category: job_post
    roles:
    - id: crypto
      query: crypto
      domain: crypto_payments
      aliases:
      - payments
      - payment
    - id: igaming
      query: igaming
      domain: igaming
    - id: digital_asset
      query: digital asset
      domain: digital_asset
    - id: game
      query: game
      domain: game
    - id: payments
      query: payment operations OR payments engineer OR payment product
      domain: payments
      aliases:
      - payment
    locations: []
    matrix:
      enabled: true
    filters:
      hiring_terms:
      - hiring
      - we are hiring
      - we're hiring
      - open role
      - job alert
      - looking for
      - vacancy
      - join our team
      - apply
      - referral
      - recruiting
      job_destination_terms:
      - "/jobs/"
      - "/careers/"
      - greenhouse.io
      - lever.co
      - ashbyhq.com
      - workable.com
      - recruitee.com
      - smartrecruiters.com
      domain_terms:
      - crypto
      - web3
      - blockchain
      - payment
      - payments
      - fintech
      - igaming
      - gaming
      - casino
      - sportsbook
      - product
      - business development
      - wallet
      - backlog
